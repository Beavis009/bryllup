<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Svar på bryllupsquiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page answer-page">
      <section class="hero">
        <p class="eyebrow">Bryllupsquiz</p>
        <h1>Svar på quizzen</h1>
        <p>Her vises det aktive spørgsmål.</p>
      </section>

      <section id="quiz-panel" class="panel answer-panel">
        <div class="participant-bar">
          <span>Du svarer som</span>
          <strong id="participant-name">-</strong>
        </div>
        <form id="quiz-form">
          <div id="question-fields" class="question-fields"></div>
          <button type="submit">Gem svar</button>
          <p id="save-status" class="status-text" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
