<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Bryllupsquiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">Bryllupsquiz</p>
        <h1>Scan og svar</h1>
        <p>QR-koden sender gæsterne til svar-siden, hvor de kun ser det aktive spørgsmål.</p>
      </section>

      <section id="start-screen" class="panel start-screen">
        <div class="start-copy">
          <strong>Til gæsterne</strong>
          <p>Scan QR-koden med telefonen for at åbne svar-siden.</p>
        </div>
        <div class="qr-box large">
          <img id="qr-code" alt="QR-kode til svar-siden" />
        </div>
        <div class="start-actions">
          <button id="start-quiz" type="button">Gå til svar-siden</button>
          <button id="share-link" type="button" class="secondary">Del link</button>
        </div>
        <p id="share-status" class="status-text"></p>
      </section>

      <section class="panel control-panel">
        <div class="board-header">
          <div>
            <h2>Aktivér spørgsmål</h2>
            <p id="active-question-status" class="muted-text">Forbinder til Firebase...</p>
          </div>
        </div>
        <div id="question-activation" class="activation-grid"></div>
      </section>
    </main>

    <script src="firebase-config.js"></script>
    <script src="home.js"></script>
  </body>
</html>
