<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Bryllupsquiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">Bryllupsquiz</p>
        <h1>12 spørgsmål til festen</h1>
        <p>Scan QR-koden, svar på alle spørgsmålene og følg vinderne undervejs.</p>
      </section>

      <section class="panel">
        <div class="mobile-cta">
          <div>
            <strong>Til mobil</strong>
            <p>Scan QR-koden og deltag direkte fra telefonen.</p>
          </div>
          <div class="qr-box">
            <img id="qr-code" alt="QR-kode til quizsiden" />
          </div>
          <button id="share-link" type="button" class="secondary">Del link</button>
          <p id="share-status" class="status-text"></p>
        </div>

        <form id="quiz-form">
          <label>
            <span>Navn</span>
            <input id="name" name="name" type="text" placeholder="Skriv dit navn" maxlength="80" required />
          </label>

          <div id="question-fields" class="question-fields"></div>

          <button type="submit">Gem svar</button>
          <p id="save-status" class="status-text" role="status" aria-live="polite"></p>
        </form>

        <div class="summary">
          <div>
            <strong id="participant-count">0</strong>
            <span>deltagere</span>
          </div>
          <div>
            <strong id="answer-count">0</strong>
            <span>svar</span>
          </div>
          <div>
            <strong id="winner-count">0/12</strong>
            <span>vindere</span>
          </div>
        </div>
      </section>

      <section class="board">
        <div class="board-header">
          <h2>Spørgsmål og vindere</h2>
          <button id="clear-btn" type="button" class="secondary" hidden>Ryd alt</button>
        </div>
        <div id="question-board" class="question-board"></div>
      </section>
    </main>

    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
